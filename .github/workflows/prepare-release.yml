name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python pin 3.14

      - name: Install dependencies
        run: uv sync

      - name: Lint, type check, and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check .
          uv run pytest

      - name: Bump version
        run: uv version --bump ${{ inputs.bump }}

      - name: Get new version
        id: version
        run: echo "value=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Commit and push release branch
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${VERSION}"
          git add pyproject.toml uv.lock
          git commit -m "v${VERSION}"
          git push origin "release/v${VERSION}"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${VERSION}" \
            --title "v${VERSION}" \
            --body "Automated release PR: bumps version to v${VERSION}. Merging this will publish the GitHub release and trigger the PyPI publish workflow."

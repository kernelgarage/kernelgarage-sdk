name: Publish to PyPI

on:
  release:
    types: [published] # Triggers when you create a GitHub Release

jobs:
  pypi-publish:
    name: Build and upload to PyPI
    runs-on: ubuntu-latest
    
    # Required for PyPI Trusted Publishing
    environment:
      name: pypi
      url: https://pypi.org/p/kernelgarage
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7 # Uses the latest major version

      - name: Set up Python
        run: uv python pin 3.14

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish

[project]
name = "kernelgarage"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
license = "MIT"
authors = [
    { name = "kernelgarage", email = "thekernelgarage@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
kernelgarage = "kernelgarage:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
